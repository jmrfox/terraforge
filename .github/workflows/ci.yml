name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned so new lints and compiler changes arrive through a deliberate bump.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo check --locked --features gui
      - run: cargo clippy --locked -- -D warnings
      - run: cargo clippy --locked --features gui -- -D warnings
